[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "org.bytedeco:javacv:$javacvVersion"
  api "com.google.guava:guava:33.5.0-android"

  api "space.earlygrey:shapedrawer:$shapedrawerVersion"

  implementation "games.spooky.gdx:gdx-nativefilechooser:$gdxNativefilechooserVersion"

  testImplementation platform("org.junit:junit-bom:6.1.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
  testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testImplementation "org.objenesis:objenesis:3.4"
}

test {
  useJUnitPlatform()
  minHeapSize = '1g'
  maxHeapSize = '2g'
}
